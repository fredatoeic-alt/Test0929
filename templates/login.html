<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 — OrderPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b1120 0%, #1e1b4b 50%, #0f172a 100%);
      overflow: hidden;
    }
    /* Animated background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      background: #6366f1;
      top: -100px; right: -100px;
      animation: float 8s ease-in-out infinite;
    }
    body::after {
      width: 300px; height: 300px;
      background: #c084fc;
      bottom: -50px; left: -50px;
      animation: float 10s ease-in-out infinite reverse;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }
    .login-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      z-index: 1;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.6s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-card h2 {
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-card .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    .form-control {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: #f1f5f9;
      padding: 0.75rem 1rem;
      border-radius: 10px;
    }
    .form-control:focus {
      background: rgba(15, 23, 42, 0.8);
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      color: #f1f5f9;
    }
    .form-label { color: #94a3b8; font-weight: 500; font-size: 0.85rem; }
    .btn-login {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      transition: all 0.3s;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
    }
    .input-group-text {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-right: none;
      color: #818cf8;
      border-radius: 10px 0 0 10px;
    }
    .input-group .form-control { border-radius: 0 10px 10px 0; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2><i class="bi bi-box-seam-fill"></i> OrderPro</h2>
    <p class="subtitle">訂單管理系統 — 管理員登入</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2" style="border-radius:10px; font-size:0.85rem;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label">帳號</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" name="username"
                 placeholder="請輸入帳號" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">密碼</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" name="password"
                 placeholder="請輸入密碼" required>
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right"></i> 登入系統
      </button>
    </form>
  </div>
</body>
</html>
