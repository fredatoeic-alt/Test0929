name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ci-test:
    name: CI - Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼 (Checkout code)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝依賴套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 執行單元測試 (Run unit tests)
        run: |
          pytest test_app.py -v

  cd-deploy:
    name: CD - Deploy to Render
    needs: ci-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 觸發 Render 自動部署 (Trigger Render Deploy Hook)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::尚未在 GitHub Repository Secrets 中設定 RENDER_DEPLOY_HOOK_URL！"
            echo "請前往 GitHub 倉庫 -> Settings -> Secrets and variables -> Actions，新增名為 RENDER_DEPLOY_HOOK_URL 的 Secret。"
            echo "（在 Render 服務頁面中的 Settings -> Deploy Hook 即可取得專屬 URL）"
            exit 1
          fi

          echo "🚀 正在觸發 Render 自動部署..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render 回應 HTTP 狀態碼: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ 成功觸發 Render 部署！"
          else
            echo "::error::觸發部署失敗 (HTTP 狀態碼: $HTTP_STATUS)"
            exit 1
          fi
